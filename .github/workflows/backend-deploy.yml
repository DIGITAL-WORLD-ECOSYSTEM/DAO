name: 🚀 Backend Deployment (Cloudflare Workers)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/**'

jobs:
  deploy:
    name: 🏗️ Build, Test & ☁️ Deploy Worker
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: ⚙️ Install Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./backend

      - name: 🔍 Lint
        run: pnpm eslint src/
        working-directory: ./backend
        continue-on-error: true # Not blocking yet

      - name: 🛡️ Type Check
        run: pnpm tsc --noEmit
        working-directory: ./backend

      - name: 🧪 Unit Tests
        run: pnpm test
        working-directory: ./backend
        continue-on-error: true # Assuming tests might not be 100% covered yet

      - name: ☁️ Deploy to Cloudflare Workers (Production)
        uses: cloudflare/wrangler-action@v3
        if: github.event_name == 'push'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ./backend
          command: deploy --env production

      - name: 🚨 Smoke Test (Health Check)
        if: github.event_name == 'push'
        run: |
          echo "Waiting for deployment to propagate..."
          sleep 5
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}\n" https://api.asppibra.com/api/core/health/live)
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Smoke test failed! Liveness probe returned HTTP $HTTP_STATUS"
            exit 1
          else
            echo "Smoke test passed! System is LIVE."
          fi
