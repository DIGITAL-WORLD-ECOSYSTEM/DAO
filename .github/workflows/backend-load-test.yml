name: ⚡ Backend Load Test (k6)

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Environment to test'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      vus:
        description: 'Target Virtual Users'
        required: false
        default: '50'

jobs:
  load-test:
    name: 🚀 k6 Load Testing
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: ⚡ Run Load Test
        run: |
          if [ "${{ github.event.inputs.target_env }}" = "production" ]; then
            export API_URL="https://api.asppibra.com"
          else
            export API_URL="https://staging.app.asppibra.com"
          fi
          k6 run backend/scripts/k6-load-test.js
